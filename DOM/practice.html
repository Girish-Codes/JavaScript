<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
</head>
<body>
    <h1 id="mainHeading">Welcome!</h1>
    <button id="changeTextButton">Change Text</button>
</body>
    <script>
        const b = document.getElementById('mainHeading');
        const c = document.getElementById('changeTextButton');
        c.addEventListener('click', () => {
            b.textContent("Hello World!");
        })
    </script>
</html>
